<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى الأبد ❤️</title>
    <style>
        body { background-color: #fdfdf0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; color: #5d4037; }
        #login-screen { text-align: center; background: white; padding: 40px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); z-index: 10; }
        .pass-container { display: flex; gap: 10px; justify-content: center; margin: 20px 0; direction: ltr; }
        .pass-field { width: 45px; height: 55px; text-align: center; font-size: 24px; font-weight: bold; border: 2px solid #e0e0e0; border-radius: 12px; background: #fafafa; outline: none; }
        #main-content { display: none; text-align: center; animation: fadeIn 2s; }
        h1 { font-style: italic; color: #880e4f; margin-bottom: 30px; font-size: 2.2rem; }
        .counter-container { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .box { background: rgba(255, 255, 255, 0.9); padding: 15px; border-radius: 20px; min-width: 85px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); border: 1px solid #fce4ec; }
        .number { font-size: 32px; font-weight: bold; color: #d81b60; display: block; }
        .label { font-size: 13px; color: #8d6e63; font-weight: bold; }
        .memories-btn { position: fixed; top: 20px; right: 20px; background: #d81b60; color: white; border: none; padding: 12px 25px; border-radius: 50px; cursor: pointer; z-index: 100; display: none; font-weight: bold; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
        .modal-content { background: white; padding: 25px; border-radius: 25px; width: 90%; max-width: 500px; text-align: center; max-height: 85vh; overflow-y: auto; }
        .gallery-area { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; margin-top: 20px; }
        .gallery-item { width: 100%; height: 130px; object-fit: cover; border-radius: 15px; border: 3px solid #fce4ec; }
        .heart { position: absolute; color: #ff4081; font-size: 20px; pointer-events: none; animation: floatUp 6s linear forwards; opacity: 0; }
        @keyframes floatUp { 0% { transform: translateY(100vh) scale(0.5); opacity: 1; } 100% { transform: translateY(-10vh) scale(1.5); opacity: 0; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <button id="memBtn" class="memories-btn" onclick="openMemories()">📅 ذكرياتنا</button>

    <div id="login-screen">
        <h2 style="color: #880e4f;">الباسورد لو سمحتي 🙂‍↕️</h2>
        <div class="pass-container">
            <input type="tel" maxlength="1" class="pass-field" onkeyup="moveNext(this, 0)">
            <input type="tel" maxlength="1" class="pass-field" onkeyup="moveNext(this, 1)">
            <input type="tel" maxlength="1" class="pass-field" onkeyup="moveNext(this, 2)">
            <input type="tel" maxlength="1" class="pass-field" onkeyup="moveNext(this, 3)">
            <input type="tel" maxlength="1" class="pass-field" onkeyup="moveNext(this, 4)">
        </div>
        <p id="error" style="color: #d32f2f; display: none;">الرمز غير صحيح!</p>
    </div>

    <div id="main-content">
        <h1>كل لحظه وانا معاكي♥</h1>
        <div class="counter-container">
            <div class="box"><span id="years" class="number">0</span><span class="label">سنة</span></div>
            <div class="box"><span id="days" class="number">0</span><span class="label">يوم</span></div>
            <div class="box"><span id="hours" class="number">0</span><span class="label">ساعة</span></div>
            <div class="box"><span id="minutes" class="number">0</span><span class="label">دقيقة</span></div>
            <div class="box"><span id="seconds" class="number">0</span><span class="label">ثانية</span></div>
        </div>
    </div>

    <div id="memoriesModal" class="modal">
        <div class="modal-content">
            <h2 style="color: #d81b60;">ألبوم أيامنا الجميلة</h2>
            <input type="date" id="targetDate" style="padding:10px; border-radius:10px;" onchange="loadImages()">
            <br><br>
            <input type="file" id="fileInp" style="display:none" onchange="uploadImage(this.files[0])">
            <button onclick="document.getElementById('fileInp').click()" style="background:#880e4f; color:white; border:none; padding:10px 20px; border-radius:10px;">+ إضافة صورة</button>
            <div id="galleryGrid" class="gallery-area"></div>
            <button onclick="closeMemories()" style="margin-top:20px; padding:10px;">إغلاق</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyChigjMlnCNOljkHEreChZ2ytG04629G_E",
            authDomain: "ourmemories-9b8b3.firebaseapp.com",
            projectId: "ourmemories-9b8b3",
            storageBucket: "ourmemories-9b8b3.firebasestorage.app",
            messagingSenderId: "436849614062",
            appId: "1:436849614062:web:f83b0d54d98e46e739a7ff"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        window.uploadImage = async (file) => {
            const date = document.getElementById('targetDate').value;
            if(!date || !file) return alert("اختار التاريخ الأول!");
            const storageRef = ref(storage, `memories/${date}/${file.name}`);
            await uploadBytes(storageRef, file);
            const url = await getDownloadURL(storageRef);
            const docRef = doc(db, "days", date);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) { await updateDoc(docRef, { urls: arrayUnion(url) }); } 
            else { await setDoc(docRef, { urls: [url] }); }
            loadImages();
        };

        window.loadImages = async () => {
            const date = document.getElementById('targetDate').value;
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = 'جاري التحميل...';
            const docSnap = await getDoc(doc(db, "days", date));
            grid.innerHTML = '';
            if (docSnap.exists()) {
                docSnap.data().urls.forEach(url => {
                    const img = document.createElement('img');
                    img.src = url; img.className = 'gallery-item';
                    grid.appendChild(img);
                });
            } else { grid.innerHTML = 'لا توجد صور.'; }
        };
    </script>

    <script>
        const inputs = document.querySelectorAll('.pass-field');
        function moveNext(el, idx) {
            if (el.value.length === 1 && idx < 4) inputs[idx + 1].focus();
            if (idx === 4 && el.value.length === 1) validatePass();
        }
        function validatePass() {
            let pass = ""; inputs.forEach(i => pass += i.value);
            if (pass === "55555") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('memBtn').style.display = 'block';
                startCounter(); startHearts();
            } else { document.getElementById('error').style.display = 'block'; }
        }
        function startCounter() {
            const startDate = new Date('March 27, 2025 00:00:00').getTime();
            setInterval(() => {
                const now = new Date().getTime(); const d = now - startDate;
                document.getElementById("years").innerText = Math.floor(d / 31557600000);
                document.getElementById("days").innerText = Math.floor((d % 31557600000) / 86400000);
                document.getElementById("hours").innerText = Math.floor((d % 86400000) / 3600000);
                document.getElementById("minutes").innerText = Math.floor((d % 3600000) / 60000);
                document.getElementById("seconds").innerText = Math.floor((d % 60000) / 1000);
            }, 1000);
        }
        function openMemories() { document.getElementById('memoriesModal').style.display = 'flex'; }
        function closeMemories() { document.getElementById('memoriesModal').style.display = 'none'; }
        function startHearts() {
            setInterval(() => {
                const h = document.createElement('div'); h.classList.add('heart'); h.innerHTML = '❤️';
                h.style.left = Math.random() * 100 + 'vw'; document.body.appendChild(h);
                setTimeout(() => h.remove(), 6000);
            }, 400);
        }
    </script>
</body>
</html>
